# Builds the desktop app for macOS, Windows and Linux, checks that each build
# starts, and publishes a GitHub release.
#
#   Push a tag such as v0.2.0  → builds and publishes the release "v0.2.0".
#   Run the workflow by hand   → builds; the files are kept as workflow artifacts.
#
# Optional signing (repository secrets; without them builds are unsigned and the
# system warns on first launch):
#   MAC_CERT_P12_BASE64, MAC_CERT_PASSWORD        Developer ID Application certificate
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID   notarization
#   WIN_CERT_PFX_BASE64, WIN_CERT_PASSWORD        Windows code signing certificate
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Builds both the Apple silicon and the Intel app. An Intel runner, because
          # Apple silicon runners are often unavailable for long stretches; CI already
          # runs the app on Apple silicon. The smoke test starts the Intel build here.
          - name: macOS
            os: macos-15-intel
            target: --mac
            smoke: dist/mac/Seed.app/Contents/MacOS/Seed
          - name: Windows
            os: windows-latest
            target: --win
            smoke: dist/win-unpacked/Seed.exe
          - name: Linux
            os: ubuntu-latest
            target: --linux
            smoke: dist/linux-unpacked/seed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Signing certificates (only when the secrets exist)
        shell: bash
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERT_P12_BASE64" ]; then
            echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/mac-cert.p12"
            echo "CSC_LINK=$RUNNER_TEMP/mac-cert.p12" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CERT_PASSWORD" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ]; then
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            fi
            echo "macOS: signing with the Developer ID certificate"
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERT_PFX_BASE64" ]; then
            echo "$WIN_CERT_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/win-cert.pfx"
            echo "WIN_CSC_LINK=$RUNNER_TEMP/win-cert.pfx" >> "$GITHUB_ENV"
            echo "WIN_CSC_KEY_PASSWORD=$WIN_CERT_PASSWORD" >> "$GITHUB_ENV"
            echo "Windows: signing with the code signing certificate"
          fi

      - name: Build
        run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never

      - name: Check that the built app starts and works
        shell: bash
        run: |
          npm install --no-save playwright@1.65
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a node test/e2e/desktop.mjs --app "${{ matrix.smoke }}"
          else
            node test/e2e/desktop.mjs --app "${{ matrix.smoke }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: seed-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage

  publish:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la files
          gh release create "$GITHUB_REF_NAME" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Seed $GITHUB_REF_NAME" \
            --generate-notes
