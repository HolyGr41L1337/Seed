# Tests on Linux, macOS and Windows, plus a smoke test of the desktop app on each.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright (drives the desktop app)
        run: npm install --no-save playwright@1.65

      - name: Desktop app smoke test
        if: runner.os != 'Linux'
        run: npm run test:desktop

      - name: Desktop app smoke test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop

      - name: Keep screenshots of failed UI checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore

      - name: Web UI end-to-end test
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:ui
