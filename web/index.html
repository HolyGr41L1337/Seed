<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Seed</title>
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <!--
    The whole built-in interface is the input bar in #dock. Every other
    region below is an empty slot that extensions can fill
    (see docs/EXTENDING.md): top, left, right, bottom, composer-top,
    composer-actions, composer-bottom, home, overlay.
  -->
  <div id="app" data-view="home">
    <header id="slot-top" class="slot" data-slot="top"></header>
    <div id="frame">
      <aside id="slot-left" class="slot" data-slot="left"></aside>
      <main id="main">
        <div id="view">
          <div id="thread" role="log" aria-live="polite"></div>
          <div id="page" hidden></div>
        </div>
        <div id="dock">
          <div id="brand" aria-hidden="true">
            <svg class="brand-mark" viewBox="0 0 48 48" width="44" height="44">
              <path d="M24 44V25" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
              <path d="M24 27C24 16 31 9 42 9c0 11-7 18-18 18Z" fill="currentColor"/>
              <path d="M24 33c0-8-5-13-13-13 0 8 5 13 13 13Z" fill="currentColor" opacity=".55"/>
            </svg>
            <div class="brand-name">Seed</div>
            <div class="brand-tagline" id="tagline"></div>
          </div>
          <div id="slot-composer-top" class="slot" data-slot="composer-top"></div>
          <form id="composer" autocomplete="off">
            <button type="button" id="new-chat" class="icon-button" hidden></button>
            <textarea id="input" rows="1" enterkeyhint="send" spellcheck="false"></textarea>
            <div id="slot-composer-actions" class="slot inline" data-slot="composer-actions"></div>
            <button type="submit" id="send" class="send-button"></button>
            <div id="command-menu" role="listbox" hidden></div>
          </form>
          <div id="hint"></div>
          <div id="slot-composer-bottom" class="slot" data-slot="composer-bottom"></div>
          <div id="connect" hidden></div>
          <div id="slot-home" class="slot" data-slot="home"></div>
        </div>
      </main>
      <aside id="slot-right" class="slot" data-slot="right"></aside>
    </div>
    <footer id="slot-bottom" class="slot" data-slot="bottom"></footer>
  </div>
  <div id="slot-overlay" class="slot" data-slot="overlay"></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
